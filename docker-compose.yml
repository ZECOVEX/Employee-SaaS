services:
  app:
    build:
      context: .
    ports:
      - "8000:80"
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: "sqlite"
      DB_DATABASE: "/var/www/html/storage/database.sqlite"
      LIVE_STREAM_SECONDS: "30"
      LIVE_POLL_INTERVAL: "5"
    volumes:
      - app-storage:/var/www/html/storage

volumes:
  app-storage:
